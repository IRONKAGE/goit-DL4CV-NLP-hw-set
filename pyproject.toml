[project]
name = "goit-dl4cv-nlp-hw-set"
version = "0.1.0"
description = "Monorepo for Deep Learning, Computer Vision and NLP projects"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    # ==========================================
    # 1. Deep Learning & AI Frameworks
    # ==========================================
    # ⚠️ АРХІТЕКТУРНЕ РІШЕННЯ: Динамічна маршрутизація версій PyTorch
    # Для Apple Silicon, Windows та Linux встановлюється найновіша версія (2.14.1)
    "torch==2.14.1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.29.1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Для Legacy-систем macOS на базі Intel (x86_64) встановлюється стабільна 2.2.2
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    # Computer Vision & NLP (Bleeding Edge)
    "ultralytics==8.4.172", # SOTA-фреймворк для детекції об'єктів та сегментації (YOLOv8/YOLOv9)
    "gensim==4.4.0",        # Векторне моделювання семантики текстів (Word2Vec/GloVe ембедінги)

    # ==========================================
    # 2. Data Processing & EDA (Memory Optimized)
    # ==========================================
    "polars==1.44.2",       # Надшвидкий рушій (Rust). Нативний стандарт для обробки табличних даних
    "pyarrow==24.0.0",      # Високопродуктивний бекенд пам'яті для Pandas/Polars
    "numpy==1.26.4",        # Математичне ядро (LTS-версія для стабільності C++ компіляторів)
    "scikit-learn==1.9.1",  # Класичні метрики, векторизатори (TF-IDF, BoW) та спліти даних
    "pillow==12.3.0",       # Високопродуктивна бібліотека для піксельних маніпуляцій зображень
    "tqdm==4.70.1",         # Моніторинг прогресу виконання важких циклів та завантажень (CLI/GUI)
    "kaggle==2.2.4",        # CLI-клієнт для автоматизованого завантаження наборів даних

    # ==========================================
    # 3. Visualization & UI Frameworks
    # ==========================================
    "matplotlib==3.11.2",   # Базовий фреймворк для побудови графіків та кривих навчання
    "seaborn==0.13.2",      # Побудова теплових карт (Heatmaps) для матриць плутанини та уваги
    "plotly==7.1.0",        # Багатовимірна інтерактивна візуалізація та аналіз залишків
    "marimo==0.25.1",       # Реактивне Python-середовище нового покоління (заміна Jupyter)
    "ruff==0.16.10",        # Надшвидкий лінтер та форматер коду (Rust), використовується Marimo

    # ==========================================
    # 4. MLOps: Tracking & Model Serving
    # ==========================================
    "mlflow==3.16.1",       # Трекінг експериментів, логування гіперпараметрів та артефактів
    "fastapi==0.142.2",     # Сучасний асинхронний фреймворк для створення ML API
    "uvicorn==0.54.0",      # ASGI-сервер для запуску FastAPI на високих швидкостях
    "pydantic==2.13.5",     # Сувора валідація вхідних даних (JSON) для моделей
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",        # Надшвидкий лінтер та форматер коду (Rust)
    "pytest==9.1.1",        # Фреймворк для модульного тестування інфраструктури
]

[tool.uv]
managed = true
